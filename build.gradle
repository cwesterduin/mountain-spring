plugins {
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'java'
}

group = 'com'
version = '1.0-SNAPSHOT'
sourceCompatibility = '21'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {

    implementation 'org.apache.commons:commons-imaging:1.0-alpha2'
    implementation 'com.amazonaws:aws-java-sdk:1.12.739'
    implementation 'org.springframework.security:spring-security-oauth2-jose:6.3.0'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server:6.3.0'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'commons-logging:commons-logging:1.3.2'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'
    implementation 'com.pgvector:pgvector:0.1.4'
    implementation 'org.hibernate.orm:hibernate-vector:6.5.2.Final'


    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'

    // Lombok dependencies
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Development-only dependency
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure:3.3.0'
    testImplementation 'com.h2database:h2:2.2.224'
}

bootJar {
    archiveClassifier.set('boot')
}

jar {
    archiveClassifier.set('')
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder:tiny'
    environment = ['BP_NATIVE_IMAGE': 'true']
}